:root {
  --ink: #1e2022;      /* the ring's spokes */
  --sky: #c9ccd2;      /* shows while the photo loads */
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--sky);
  color: var(--ink);
  font-family: "Jost", Futura, "Century Gothic", "Avenir Next", sans-serif;
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
}
.photo {
  position: fixed; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover; object-position: 51% 50%;
}
main {
  position: relative;
  min-height: 100vh; min-height: 100svh;
  display: flex; flex-direction: column; justify-content: space-between; align-items: center;
  padding: clamp(28px, 7vh, 72px) 24px clamp(28px, 6vh, 64px);
  text-align: center;
}
h1 {
  margin: 0;
  font-weight: 300;
  font-size: clamp(1.75rem, 1.1rem + 2.6vw, 3rem);
  letter-spacing: 0.14em;
  margin-right: -0.14em; /* keeps tracked text optically centered */
  line-height: 1.1;
}
.links {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 0.4em 2em;
  font-size: clamp(1rem, 0.93rem + 0.3vw, 1.15rem);
}
a {
  color: inherit;
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 0.3em;
  padding: 0.5em 0;
}
a:hover { text-decoration-thickness: 2px; }
a:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; border-radius: 2px; }
</style>
